name: Release

on:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends pipewire pipewire-bin zstd
      - run: cargo build --release --locked -p pods
      - env:
          ARCH: ${{ matrix.arch }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Sample input: pods 1.0.0
          printed=$(target/release/pods --version)
          version=${printed#pods }
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "v$version" ]]; then
            printf 'tag %s disagrees with binary version %s\n' "$REF_NAME" "$version" >&2
            exit 1
          fi
          cargo xtask release-check target/release/pods "$version"
          packaging/package.sh --arch "$ARCH" --version "$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pods-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  prove:
    needs: build
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PODS_TRAP_EXPECT_NO_RADIO: "1"
      NEXTEST_SUCCESS_OUTPUT: final
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends pipewire pipewire-bin zstd
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pods-${{ matrix.arch }}
          path: dist
      - env:
          ARCH: ${{ matrix.arch }}
        run: |
          proof=$(mktemp -d)
          trap '[[ "$proof" == /?* && -f "$proof/.pods-proof" ]] && rm -rf -- "$proof"' EXIT
          touch "$proof/.pods-proof"
          (cd dist && sha256sum --check --strict ./*.tar.zst.sha256)
          tar --zstd -xf dist/pods-linux-"$ARCH"-*.tar.zst -C "$proof"
          bundles=("$proof"/pods-linux-"$ARCH"-*)
          [[ ${#bundles[@]} == 1 ]]
          bundle=${bundles[0]}
          (cd "$bundle" && sha256sum --check --strict MANIFEST.sha256)
          PODS_E2E_BINARY="$bundle/bin/pods" cargo nextest run -p pods --locked --run-ignored all

  publish:
    if: github.ref_type == 'tag'
    needs: [build, prove]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pods-*
          merge-multiple: true
          path: dist
      - env:
          TAG: ${{ github.ref_name }}
        working-directory: dist
        run: |
          version=${TAG#v}
          for arch in x86_64 aarch64; do
            sha256sum --check --strict "pods-linux-$arch-$version.tar.zst.sha256"
          done
          cp ../packaging/web-install.sh install.sh
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/pods-linux-*.tar.zst
            dist/pods-linux-*.tar.zst.sha256
            dist/install.sh
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=${TAG#v}
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag "${prerelease[@]}" --title "$TAG" \
            "dist/pods-linux-x86_64-$VERSION.tar.zst" "dist/pods-linux-x86_64-$VERSION.tar.zst.sha256" \
            "dist/pods-linux-aarch64-$VERSION.tar.zst" "dist/pods-linux-aarch64-$VERSION.tar.zst.sha256" \
            dist/install.sh
