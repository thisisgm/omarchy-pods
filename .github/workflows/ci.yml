name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIBREPODS_TRAP_EXPECT_NO_RADIO: "1"
      NEXTEST_SUCCESS_OUTPUT: final
    steps:
      - run: uname -r
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The installer's bench reads the files the old v1.3.6 install left from that tag.
          fetch-tags: true
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends pipewire pipewire-bin
      - run: pipewire --version
      # No development files here, so this build is the proof that pods-pw links the library by its soname alone.
      - run: test ! -e /usr/lib/x86_64-linux-gnu/libpipewire-0.3.so
      - run: cargo nextest run --workspace --locked
      - run: cargo test --doc --workspace
      # verify needs the ExecStart program to exist and a runtime directory, so both live in a temporary home.
      - run: |
          systemd-analyze --version
          home=$(mktemp -d)
          mkdir -p "$home/.local/bin"
          printf '#!/bin/sh\n' > "$home/.local/bin/librepods"
          chmod +x "$home/.local/bin/librepods"
          log="$home/verify.log"
          # verify only warns about an unknown key or a bad value and still exits 0, so any output fails the step.
          if ! HOME="$home" XDG_RUNTIME_DIR="$home" systemd-analyze --user verify packaging/systemd/librepods.service > "$log" 2>&1 || [ -s "$log" ]; then
            cat "$log"
            exit 1
          fi

  slow:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXTEST_SUCCESS_OUTPUT: final
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends pipewire pipewire-bin
      - run: pipewire --version
      - run: cargo nextest run -p librepods -p xtask --locked --run-ignored only

  pw-ffi:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The generator reads the headers with this libclang, whatever other versions the image holds.
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libpipewire-0.3-dev libclang-18-dev
      # The committed file is what the 1.0.5 headers give: a later Ubuntu revision of 1.0.5 passes, another version stops here.
      - run: dpkg-query --show --showformat='${Version}\n' libpipewire-0.3-dev | grep --quiet '^1\.0\.5-'
      - run: cargo install --locked bindgen-cli@0.73.2
      - run: cargo xtask pw-ffi
      - run: git diff --exit-code crates/pw/src/ffi.rs

  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTFLAGS: -Zsanitizer=address
      # Whole allocation stacks with their function names (from addr2line where no llvm-symbolizer is installed), which the suppression file matches.
      ASAN_OPTIONS: fast_unwind_on_malloc=0:allow_addr2line=1
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/crates/pw/lsan.supp:print_suppressions=0
      NEXTEST_SUCCESS_OUTPUT: final
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends pipewire pipewire-bin
      - run: rustup toolchain install nightly-2026-11-20 --profile minimal
      - run: cargo +nightly-2026-11-20 nextest run -p pods-pw --locked --target x86_64-unknown-linux-gnu

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check

  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

  plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8
      - run: deno run --allow-read tests/model.test.js
      # The stock plugin validator refuses a plugin folder that holds a symlink.
      - run: |
          tracked=$(git ls-files -s)
          links=$(printf '%s\n' "$tracked" | grep '^120000 ' || true)
          if [ -n "$links" ]; then
            echo "the repository tracks a symlink, which the plugin validator refuses: $links"
            exit 1
          fi

  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends shellcheck
      # The lint findings are those of this ShellCheck release: a later Ubuntu revision of 0.9.0 passes, another version stops here.
      - run: dpkg-query --show --showformat='${Version}\n' shellcheck | grep --quiet '^0\.9\.0-'
      - run: |
          for script in packaging/setup setup; do
            bash -n "$script"
          done
      - run: shellcheck packaging/setup setup

  ci-ok:
    if: always()
    needs: [fmt, clippy, test, slow, pw-ffi, sanitize, deny, zizmor, plugin, shell]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "a required job finished as $result"
              exit 1
            fi
          done
