[package]
name = "xtask"
description = "Workspace checks, run as cargo xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
opuscule.workspace = true
pods-core = { path = "../core" }
pods-mic = { path = "../mic" }
pods-proto.workspace = true
pods-pw = { path = "../pw" }
pods-sys.workspace = true
rustix = { workspace = true, features = ["fs", "process", "time"] }
# `RawValue` keeps each value of a status line as the bytes it holds, for C9.
serde_json = { workspace = true, features = ["raw_value"] }
signal-hook.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[dev-dependencies]
allocation-counter.workspace = true
pods-fake = { path = "../fake" }
pods-pwrig = { path = "../pwrig" }
pods-samples = { path = "../samples" }
pods-trap = { path = "../trap" }
proptest.workspace = true

[lints]
workspace = true

# Does its work only under `cargo bench`, which of the gates only `cargo xtask ci bench` runs: it downloads its tools and its music.
[[bench]]
name = "codec"
harness = false
