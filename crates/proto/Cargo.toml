[package]
name = "pods-proto"
description = "Parsers and encoders for the packets AirPods and a host exchange"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Resolves the pods' random address and opens their advert, the AES block the C++ daemon takes from OpenSSL; `zeroize` wipes its key schedule.
aes = { version = "0.9.4", default-features = false, features = ["zeroize"] }
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
cpp-source = { path = "../cpp-source" }
pods-samples = { path = "../samples" }
proptest.workspace = true

[lints]
workspace = true
