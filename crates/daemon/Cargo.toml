[package]
name = "librepods"
description = "AirPods daemon for the Omarchy bar plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
pods-core = { path = "../core" }
pods-mic = { path = "../mic" }
pods-proto.workspace = true
pods-pw = { path = "../pw" }
pods-sys.workspace = true
# Requests to the desktop's audio server are written through the protocol crate; its replies are read by hand.
pulseaudio = "0.3.2"
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs", "process"] }
serde_json.workspace = true
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time", "signal", "sync", "io-util", "process"] }
zbus = { version = "6.3", default-features = false, features = ["tokio", "service"] }
zeroize.workspace = true

[dev-dependencies]
cpp-source = { path = "../cpp-source" }
pods-fake = { path = "../fake" }
pods-pwrig = { path = "../pwrig" }
pods-samples = { path = "../samples" }
pods-trap = { path = "../trap" }
proptest.workspace = true
# The lure test listens on sockets of its own, and a driver test reads its thread's CPU time.
rustix = { version = "1.1.6", default-features = false, features = ["std", "net", "time"] }
tempfile.workspace = true
# The driver's ladder tests run on a paused clock, which only this feature offers.
tokio = { version = "1.54.1", default-features = false, features = ["test-util"] }
# The in process tests serve the interface over a socket pair, which a peer to peer connection needs.
zbus = { version = "6.3", default-features = false, features = ["tokio", "service", "p2p"] }

[lints]
workspace = true
