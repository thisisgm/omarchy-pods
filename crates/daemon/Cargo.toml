[package]
name = "librepods"
description = "AirPods daemon for the Omarchy bar plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
pods-core = { path = "../core" }
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs", "process"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time", "signal", "sync", "io-util"] }

[dev-dependencies]
cpp-source = { path = "../cpp-source" }
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
