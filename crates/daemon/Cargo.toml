[package]
name = "librepods"
description = "AirPods daemon for the Omarchy bar plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
pods-core = { path = "../core" }
pods-proto.workspace = true
pods-sys.workspace = true
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs", "process"] }
serde_json.workspace = true
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time", "signal", "sync", "io-util"] }
zbus = { version = "6.3", default-features = false, features = ["tokio", "service"] }

[dev-dependencies]
cpp-source = { path = "../cpp-source" }
pods-fake = { path = "../fake" }
pods-samples = { path = "../samples" }
proptest.workspace = true
# A test reads its thread's CPU time to tell an idle driver from a spinning one.
rustix = { version = "1.1.6", default-features = false, features = ["time"] }
tempfile.workspace = true
# The in process tests serve the interface over a socket pair, which a peer to peer connection needs.
zbus = { version = "6.3", default-features = false, features = ["tokio", "service", "p2p"] }

[lints]
workspace = true
