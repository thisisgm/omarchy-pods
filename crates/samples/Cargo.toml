[package]
name = "pods-samples"
description = "Test support that builds sample control channel packets from the documented layout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Test support only: a dev-dependency, or a dependency of another test-only crate, never of the product.
[dependencies]
# Seals a synthetic advert and builds its address with the AES block the C++ daemon uses.
aes = { version = "0.9.4", default-features = false }
cpp-source = { path = "../cpp-source" }
# Its bit writer and its spectral codebooks write the synthetic audio units.
rusty_aac.workspace = true

[lints]
workspace = true
