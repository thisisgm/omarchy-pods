[graph]
all-features = true

[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"

[licenses]
# The allow-list is policy for crates added later, so an unused entry is not a warning.
unused-allowed-license = "allow"
# rusty_aac is labelled Apache-2.0 and reads as a port of the LGPL-2.1-or-later FFmpeg decoder; open, and GPL-3.0 takes either.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "GPL-3.0-only",
]

[bans]
deny = [
    { crate = "openssl-sys", reason = "TLS is not part of this daemon" },
    { crate = "libdbus-sys", reason = "D-Bus is reached through pure Rust, not libdbus" },
    { crate = "rusty_aac", wrappers = ["pods-mic", "pods-samples", "xtask"], reason = "the microphone's decoder: pods-mic fences every call into it, the samples use its bit writer and codebooks, and the developer tool measures it under other configurations" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
