[graph]
all-features = true

[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"

[licenses]
# The allow-list is policy for crates added later, so an unused entry is not a warning.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
deny = [
    { crate = "openssl-sys", reason = "TLS is not part of this daemon" },
    { crate = "libdbus-sys", reason = "D-Bus is reached through pure Rust, not libdbus" },
    { crate = "pods-opus", wrappers = ["pods-mic", "xtask"], reason = "the dictation stream's decoder: pods-mic fences every call into it, and the developer tool measures it against other decoders" },
    { crate = "pods-aac", wrappers = ["pods-mic", "pods-samples"], reason = "the microphone's decoder: pods-mic fences every call into it, and the samples use its bit writer and codebook 1 emitter" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
